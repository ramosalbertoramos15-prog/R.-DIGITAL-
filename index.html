<html lang="pt">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R DIGITAL</title>
<meta name="description" content="R DIGITAL — streaming, IA e ferramentas criativas com ativação rápida. Pague por M-Pesa, e-Mola ou BIM.">
<meta name="theme-color" content="#070B1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: cabeçalho fixo, hero curto, catálogo em grelha por categorias, passos, FAQ e rodapé. Marca azul-noite com ouro. */
:root{
  --bg:#070B1A; --surface:#0E1530; --surface-2:#151F44; --line:#27335F;
  --fg:#F2F5FF; --muted:#9FAAD3; --accent:#FFC21A; --accent-fg:#1B1400; --blue:#3A72FF;
  --ok:#3DDC97; --warn:#FFB020; --bad:#FF6B7A;
  --font-display:'Sora','Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EAEFFB; --line:#D3DBF0;
    --fg:#0B1230; --muted:#4F5B86; --accent:#F2B100; --accent-fg:#1B1400; --blue:#2358E6;
    --ok:#0E9F6E; --warn:#B7791F; --bad:#D63A4B; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EAEFFB; --line:#D3DBF0;
  --fg:#0B1230; --muted:#4F5B86; --accent:#F2B100; --accent-fg:#1B1400; --blue:#2358E6;
  --ok:#0E9F6E; --warn:#B7791F; --bad:#D63A4B; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.2px;
  background:none;border:0;cursor:pointer;padding:0;margin-inline-end:auto}
.brand svg{width:24px;height:24px}
.brand b{color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.lang,.btn,.chip-btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer;min-height:40px}
.btn{font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.green{background:#1FA855;border-color:#1FA855;color:#fff}

/* Hero */
.hero{padding:38px 0 8px;display:grid;gap:18px}
.hero h1{font-size:clamp(28px,6.2vw,48px);font-weight:800;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:60ch;color:var(--muted);font-size:16px;margin:0}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.trust div{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.trust svg{width:22px;height:22px;flex:none;color:var(--accent)}

/* Catálogo */
section{padding-top:34px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:clamp(21px,4vw,28px)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card .row{display:flex;align-items:center;gap:12px}
.mono{position:relative;overflow:hidden;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px;color:#fff;flex:none}
.mono img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05081a}
.cat-ai{background:#2F6BFF}.cat-video{background:#D8344A}.cat-music{background:#19A463}.cat-create{background:#8A4DFF}.cat-games{background:#E8731A}
.card h3{font-size:17px}
.card .tag{color:var(--muted);font-size:13.5px;margin:0;flex:1}
.price{font-family:var(--font-display);font-weight:800;font-size:25px;color:var(--accent)}
.price small{font-size:13px;color:var(--muted);font-weight:600;margin-inline-start:2px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Passos / FAQ */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.step b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:var(--font-display);margin-bottom:10px}
.step h3{font-size:16px;margin-bottom:4px}.step p{margin:0;color:var(--muted);font-size:14px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;color:var(--muted)}
.secure{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.secure li{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}

footer{margin-top:44px;border-top:1px solid var(--line);padding-top:22px;display:grid;gap:14px;color:var(--muted);font-size:14px}
footer .links{display:flex;flex-wrap:wrap;gap:6px 18px}
footer a,footer button.link{color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:14px}

/* Modal */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(3,6,18,.72)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.m-head h3{font-size:19px}
.m-body{padding:16px 18px 20px;display:grid;gap:14px}
.x{background:none;border:0;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;color:var(--muted)}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],textarea,select.field{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:44px}
input[type=file]{padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);width:100%}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:600;min-height:44px}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.box{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.box .k{color:var(--muted)}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.copy code{font-size:16px;font-weight:700;letter-spacing:.3px;overflow-wrap:anywhere}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.err{color:var(--bad);font-size:14px;margin:0}
.okmsg{color:var(--ok);font-size:14px;margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{background:color-mix(in srgb,var(--warn) 16%,var(--bg));border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:14px}

/* Pedidos e admin */
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-pending{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.st-paid{background:color-mix(in srgb,var(--blue) 24%,transparent);color:var(--blue)}
.st-delivered{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.st-rejected{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.olist{display:grid;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.order .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.delivery{background:color-mix(in srgb,var(--ok) 12%,var(--bg));border:1px solid var(--ok);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:26px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td input[type=number]{width:100px;min-height:36px;padding:6px 8px}
td textarea{min-height:60px;min-width:180px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;max-width:420px;background:var(--fg);color:var(--bg);
  border-radius:12px;padding:12px 16px;z-index:50;font-weight:600;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.fab{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;
  width:54px;height:54px;border-radius:50%;background:#1FA855;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);border:0;cursor:pointer;text-decoration:none}
.fab svg{width:28px;height:28px;color:#fff}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media (max-width:420px){.methods{grid-template-columns:1fr}}
</style>
</head>

async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); const o = btn.textContent; btn.textContent = t("copied"); setTimeout(()=>btn.textContent=o,1400); }
  catch(e){ const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}

$("#dlg").addEventListener("click", e => { if(e.target.id === "dlg") closeDlg(); });

function renderNav(){
  const langOpts = Object.entries(LANGS).map(([k,v]) => `<option value="${k}" ${k===S.lang?"selected":""}>${esc(v)}</option>`).join("");
  let h = `<select class="lang" id="langSel" aria-label="Language">${langOpts}</select>`;
  if(S.user){
    h += `<button class="btn" data-go="orders">${esc(t("orders"))}</button>`;
    if(S.profile && S.profile.is_admin) h += `<button class="btn" data-go="admin">${esc(t("admin"))}</button>`;
    h += `<button class="btn" id="outBtn">${esc(t("logout"))}</button>`;
  } else {
    h += `<button class="btn primary" id="inBtn">${esc(t("login"))}</button>`;
  }
  $("#nav").innerHTML = h;
}

function trustIcons(){
  const bolt = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
  const shield = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>';
  const head = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>';
  const tagi = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13 13 20a2 2 0 0 1-3 0L3 13V4h9l8 8a2 2 0 0 1 0 1z"/><circle cx="7.5" cy="8.5" r="1"/></svg>';
  return [bolt, shield, head, tagi];
}

function renderShop(){
  const ic = trustIcons();
  const list = S.products.filter(p => p.active && (S.cat === "all" || p.category === S.cat));
  const tabs = ["all", ...CATS].map(c => `<button data-cat="${c}" aria-pressed="${S.cat===c}">${esc(t(c))}</button>`).join("");
  const cards = list.map(p => `
    <article class="card">
      <div class="row"><div class="mono cat-${esc(p.category)}" aria-hidden="true"><span>${esc(initials(p.name))}</span><img src="logo-${esc(p.slug)}.png" alt="" loading="lazy" onerror="this.remove()"></div><h3>${esc(p.name)}</h3></div>
      <p class="tag">${esc(tag(p.slug))}</p>
      <div class="foot"><div class="price">${esc(Number(p.price).toLocaleString("pt-PT"))}<small>MT</small></div>
        <button class="btn primary" data-buy="${esc(p.id)}">${esc(t("buy"))}</button></div>
    </article>`).join("");
  const faq = [1,2,3,4].map(i => `<details><summary>${esc(t("q"+i))}</summary><p>${esc(t("a"+i))}</p></details>`).join("");
  return `
  <section class="hero" style="padding-top:38px">
    <h1>${esc(t("hero_a"))} <em>${esc(t("hero_b"))}</em></h1>
    <p>${esc(t("hero_p"))}</p>
    <div class="trust">${[1,2,3,4].map(i=>`<div>${ic[i-1]}<span>${esc(t("tr"+i))}</span></div>`).join("")}</div>
    ${DEMO ? `<div class="demo">${esc(t("demo"))}</div>` : ""}
  </section>
  <section id="catalog">
    <div class="sec-head"><h2>${esc(t("catalog"))}</h2></div>
    <div class="tabs" role="group">${tabs}</div>
    <div class="grid" style="margin-top:14px">${cards}</div>
  </section>
  <section>
    <div class="sec-head"><h2>${esc(t("how"))}</h2></div>
    <div class="steps">
      ${[1,2,3].map(i=>`<div class="step"><b>${i}</b><h3>${esc(t("s"+i+"t"))}</h3><p>${esc(t("s"+i+"d"))}</p></div>`).join("")}
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>${esc(t("safe"))}</h2></div>
    <ul class="secure">${[1,2,3,4].map(i=>`<li>${esc(t("sf"+i))}</li>`).join("")}</ul>
  </section>
  <section>
    <div class="sec-head"><h2>${esc(t("faq"))}</h2></div>
    ${faq}
  </section>`;
}

function renderOrders(){
  const rows = S.orders.map(o => `
    <div class="order">
      <div class="top"><strong>${esc(o.product_name)}</strong><span class="badge st-${esc(o.status)}">${esc(t("st_"+o.status))}</span></div>
      <div class="muted">${esc(fmtDate(o.created_at))} · ${esc(fmt(o.amount))} · ${esc((CONFIG.PAYMENTS[o.method]||{}).label || o.method)}</div>
      ${o.delivery_note ? `<div><div class="muted" style="margin-bottom:4px">${esc(t("access"))}</div><div class="delivery">${esc(o.delivery_note)}</div></div>` : ""}
    </div>`).join("");
  return `<section><div class="sec-head"><h2>${esc(t("orders"))}</h2><button class="btn" data-go="shop">${esc(t("back"))}</button></div>
    <div class="olist">${rows || `<p class="muted">${esc(t("no_orders"))}</p>`}</div></section>`;
}

/* ---------- Painel do administrador (português) ---------- */
const ST_PT = { pending:"Pendente", paid:"Pago", delivered:"Entregue", rejected:"Rejeitado" };
async function renderAdmin(){
  const tabs = [["orders","Pedidos"],["clients","Clientes"],["products","Produtos"]]
    .map(([k,v]) => `<button data-atab="${k}" aria-pressed="${S.adminTab===k}">${v}</button>`).join("");
  let body = `<p class="muted">A carregar...</p>`;
  $("#app").innerHTML = `<section><div class="sec-head"><h2>Painel de administrador</h2><button class="btn" data-go="shop">Ver loja</button></div>
    <div class="tabs" style="margin-bottom:14px">${tabs}</div><div id="adminBody">${body}</div></section>`;
  try{
    if(S.adminTab === "orders") body = await adminOrdersHtml();
    else if(S.adminTab === "clients") body = await adminClientsHtml();
    else body = adminProductsHtml();
  }catch(e){ body = `<p class="err">Erro ao carregar: ${esc(e.message || e)}</p>`; }
  const el = $("#adminBody"); if(el) el.innerHTML = body;
}
async function adminOrdersHtml(){
  const list = await api.adminOrders();
  const c = s => list.filter(o => o.status === s).length;
  const total = list.filter(o => o.status === "paid" || o.status === "delivered").reduce((a,o)=>a+Number(o.amount),0);
  const stats = `<div class="stats">
    <div class="stat"><b>${c("pending")}</b><span class="muted">Pendentes</span></div>
    <div class="stat"><b>${c("paid")}</b><span class="muted">Pagos por entregar</span></div>
    <div class="stat"><b>${c("delivered")}</b><span class="muted">Entregues</span></div>
    <div class="stat"><b>${esc(fmt(total))}</b><span class="muted">Vendas confirmadas</span></div></div>`;
  const rows = list.map(o => `<tr>
    <td>${esc(fmtDate(o.created_at))}</td>
    <td>${esc((o.profiles && o.profiles.email) || "")}${o.phone ? `<br><span class="muted">${esc(o.phone)}</span>` : ""}</td>
    <td><strong>${esc(o.product_name)}</strong><br><span class="muted">${esc(fmt(o.amount))} · ${esc((CONFIG.PAYMENTS[o.method]||{}).label || o.method)}</span>${o.player_id ? `<br>ID: <b>${esc(o.player_id)}</b>` : ""}</td>
    <td>${o.receipt_path ? `<button class="btn sm" data-receipt="${esc(o.receipt_path)}">Ver comprovativo</button>` : '<span class="muted">sem anexo</span>'}</td>
    <td><span class="badge st-${esc(o.status)}">${esc(ST_PT[o.status])}</span></td>
    <td><textarea id="note-${esc(o.id)}" placeholder="Acesso / mensagem para o cliente" aria-label="Nota de entrega">${esc(o.delivery_note || "")}</textarea>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <button class="btn sm" data-set="paid" data-id="${esc(o.id)}">Pago</button>
        <button class="btn sm primary" data-set="delivered" data-id="${esc(o.id)}">Entregar</button>
        <button class="btn sm" data-set="rejected" data-id="${esc(o.id)}">Rejeitar</button>
      </div></td></tr>`).join("");
  return stats + `<div class="tbl"><table><thead><tr><th>Data</th><th>Cliente</th><th>Produto</th><th>Prova</th><th>Estado</th><th>Ação</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="muted">Sem pedidos.</td></tr>'}</tbody></table></div>`;
}
async function adminClientsHtml(){
  const list = await api.adminUsers();
  const never = list.filter(u => !u.last_sign_in_at).length;
  const stats = `<div class="stats"><div class="stat"><b>${list.length}</b><span class="muted">Contas criadas</span></div>
    <div class="stat"><b>${list.length-never}</b><span class="muted">Já entraram</span></div>
    <div class="stat"><b>${never}</b><span class="muted">Nunca entraram</span></div></div>`;
  const rows = list.map(u => `<tr><td>${esc(u.email || "")}</td><td>${esc(u.provider)}</td><td>${esc(fmtDate(u.created_at))}</td>
    <td>${u.last_sign_in_at ? esc(fmtDate(u.last_sign_in_at)) : '<span class="badge st-pending">nunca entrou</span>'}</td><td>${esc(u.orders_count)}</td></tr>`).join("");
  return stats + `<div class="tbl"><table><thead><tr><th>Email</th><th>Entrada por</th><th>Criada em</th><th>Último acesso</th><th>Pedidos</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="muted">Sem clientes.</td></tr>'}</tbody></table></div>`;
}

/* ---------- Modais ---------- */
function authModal(msg){
  openDlg(`<div class="m-head"><h3>${esc(t("auth_t"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
  <div class="m-body">
    ${S.pending ? `<p class="muted" style="margin:0">${esc(t("sess_need"))}</p>` : ""}
    <button class="btn block" data-oauth="google">${esc(t("google"))}</button>
    <button class="btn block" data-oauth="facebook">${esc(t("facebook"))}</button>
    <div class="or">${esc(t("or"))}</div>
    <form id="authForm" style="display:grid;gap:12px">
      <label>${esc(t("email"))}<input type="email" id="au-email" required autocomplete="email"></label>
      <label>${esc(t("pass"))}<input type="password" id="au-pass" required minlength="8" autocomplete="current-password"></label>
      <p class="err" id="au-err" role="alert">${esc(msg || "")}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn primary" type="submit" data-mode="in">${esc(t("auth_in"))}</button>
        <button class="btn" type="submit" data-mode="up">${esc(t("auth_up"))}</button>
      </div>
    </form>
    <p class="muted" style="margin:0;font-size:13px">${esc(t("auth_note"))}</p>
  </div>`);
}

let coState = { method:"mpesa" };
function payBlock(method, amount){
  const p = CONFIG.PAYMENTS[method];
  const rows = [];
  if(p.holder) rows.push(`<div><span class="k">${esc(t("holder"))}:</span> <b>${esc(p.holder)}</b></div>`);
  if(method === "bim"){
    if(p.number) rows.push(`<div class="copy"><span><span class="k">${esc(t("account"))}:</span> <code>${esc(p.number)}</code></span><button type="button" class="btn sm" data-copy="${esc(p.number)}">${esc(t("copy"))}</button></div>`);
    if(p.nib) rows.push(`<div class="copy"><span><span class="k">${esc(t("nib"))}:</span> <code>${esc(p.nib)}</code></span><button type="button" class="btn sm" data-copy="${esc(p.nib)}">${esc(t("copy"))}</button></div>`);
  } else if(p.number){
    rows.push(`<div class="copy"><span><span class="k">${esc(t("number"))}:</span> <code>${esc(p.number)}</code></span><button type="button" class="btn sm" data-copy="${esc(p.number)}">${esc(t("copy"))}</button></div>`);
  }
  if(!rows.length) return `<div class="box"><span>${esc(t("not_cfg"))}</span></div>`;
  return `<div class="box"><div class="k">${esc(t("pay_to"))}</div>${rows.join("")}<div><span class="k">${esc(t("amount"))}:</span> <b>${esc(fmt(amount))}</b></div></div>`;
}
function checkoutModal(p){
  const methods = Object.entries(CONFIG.PAYMENTS).map(([k,v]) => `<button type="button" data-method="${k}" aria-pressed="${coState.method===k}">${esc(v.label.split(" ")[0])}</button>`).join("");
  openDlg(`<div class="m-head"><h3>${esc(t("co_t"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
  <form class="m-body" id="coForm" data-pid="${esc(p.id)}">
    <div class="sum"><strong>${esc(p.name)}</strong><span class="price" style="font-size:21px">${esc(fmt(p.price))}</span></div>
    <div><div style="font-weight:600;font-size:14px;margin-bottom:8px">${esc(t("pay_with"))}</div><div class="methods">${methods}</div></div>
    <div id="payInfo">${payBlock(coState.method, p.price)}</div>
    <label>${esc(t("your_phone"))}<input type="tel" id="co-phone" inputmode="tel" autocomplete="tel" maxlength="20"></label>
    ${p.needs_player_id ? `<label>${esc(t("player"))}<input type="text" id="co-pid" required maxlength="24" inputmode="numeric"></label>` : ""}
    <label>${esc(t("receipt"))}<input type="file" id="co-file" accept="image/jpeg,image/png,image/webp,application/pdf"><span class="muted" style="font-weight:400">${esc(t("receipt_h"))}</span></label>
    <p class="err" id="co-err" role="alert"></p>
    <button class="btn primary block" type="submit" id="coBtn">${esc(t("send"))}</button>
  </form>`);
}
function policyModal(k){
  const [title, text] = policy(k);
  openDlg(`<div class="m-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div><div class="m-body"><p style="margin:0">${esc(text)}</p></div>`);
}

function renderFooter(){
  return `<footer><div><strong style="color:var(--fg)">R DIGITAL</strong> · Streaming &amp; Mais</div>
    <div>${esc(t("support"))} WhatsApp: <b style="color:var(--fg)">${esc(CONFIG.WHATSAPP_SHOW)}</b> · ${esc(t("call"))}: <b style="color:var(--fg)">${esc(CONFIG.PHONE_SHOW)}</b></div>
    <div class="links"><button class="link" data-policy="terms">${esc(t("terms"))}</button><button class="link" data-policy="privacy">${esc(t("privacy"))}</button><button class="link" data-policy="refund">${esc(t("refund"))}</button></div></footer>`;
}

async function render(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  $("#fab").href = `https://wa.me/${CONFIG.WHATSAPP}`;
  renderNav();
  if(S.view === "admin" && S.profile && S.profile.is_admin){ await renderAdmin(); $("#app").insertAdjacentHTML("beforeend", renderFooter()); return; }
  if(S.view === "orders" && S.user){
    try{ S.orders = await api.myOrders(); }catch(e){ S.orders = []; }
    $("#app").innerHTML = renderOrders() + renderFooter(); return;
  }
  S.view = "shop";
  $("#app").innerHTML = renderShop() + renderFooter();
}

/* ---------- Eventos ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button, a");
  if(!el) return;
  const d = el.dataset;
  if(el.id === "brand"){ S.view = "shop"; render(); window.scrollTo(0,0); }
  else if(el.id === "inBtn"){ S.pending = null; authModal(); }
  else if(el.id === "outBtn"){ try{ await api.signOut(); }catch(_){} S.user = null; S.profile = null; S.view = "shop"; render(); }
  else if(d.go){ S.view = d.go; render(); window.scrollTo(0,0); }
  else if(d.cat){ S.cat = d.cat; render(); }
  else if(d.close !== undefined){ closeDlg(); }
  else if(d.policy){ policyModal(d.policy); }
  else if(d.buy){
    const p = S.products.find(x => String(x.id) === d.buy); if(!p) return;
    if(!S.user){ S.pending = p.id; authModal(); } else { coState.method = "mpesa"; checkoutModal(p); }
  }
  else if(d.method){
    coState.method = d.method;
    document.querySelectorAll("[data-method]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.method === d.method)));
    const p = S.products.find(x => String(x.id) === $("#coForm").dataset.pid);
    $("#payInfo").innerHTML = payBlock(d.method, p.price);
  }
  else if(d.copy){ copyText(d.copy, el); }
  else if(d.oauth){ try{ await api.oauth(d.oauth); }catch(err){ const x = $("#au-err"); if(x) x.textContent = t("auth_fail"); } }
  else if(d.atab){ S.adminTab = d.atab; render(); }
  else if(d.set){
    const note = ($("#note-"+d.id) || {}).value || "";
    try{ await api.setOrder(d.id, d.set, note); toast("Pedido atualizado"); renderAdmin(); }catch(err){ toast("Erro: " + (err.message || err)); }
  }
  else if(d.receipt){
    try{ const url = await api.receiptUrl(d.receipt); if(url) window.open(url, "_blank", "noopener"); else toast("Comprovativo indisponível no modo demonstração"); }
    catch(err){ toast("Erro: " + (err.message || err)); }
  }
  else if(d.saveprod){
    const id = d.saveprod;
    try{ await api.saveProduct({ id, price:Number($("#pr-"+id).value), active:$("#ac-"+id).checked }); S.products = await api.products(); toast("Guardado"); }
    catch(err){ toast("Erro: " + (err.message || err)); }
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "langSel"){ S.lang = e.target.value; store.set("lang", S.lang); render(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if(f.id === "authForm"){
    const mode = (e.submitter && e.submitter.dataset.mode) || "in";
    const email = $("#au-email").value.trim(), pw = $("#au-pass").value, err = $("#au-err");
    err.textContent = "";
    if(pw.length < 8){ err.textContent = t("pass_short"); return; }
    try{
      let res;
      if(mode === "up"){
        const r = await api.signUp(email, pw);
        if(r.needsConfirm){ err.className = "okmsg"; err.textContent = t("check_mail"); return; }
        res = await api.init();
      } else res = await api.signIn(email, pw);
      await afterLogin(res);
    }catch(ex){ err.className = "err"; err.textContent = t("auth_fail"); }
  }
  else if(f.id === "coForm"){
    const err = $("#co-err"), btn = $("#coBtn"); err.textContent = "";
    const file = $("#co-file").files[0];
    if(!file){ err.textContent = t("need_receipt"); return; }
    if(!ALLOWED.includes(file.type) || file.size > 5*1024*1024){ err.textContent = t("bad_file"); return; }
    btn.disabled = true; btn.textContent = t("sending");
    try{
      await api.createOrder({ product_id:f.dataset.pid, method:coState.method, phone:$("#co-phone").value.trim().slice(0,20),
        player_id: $("#co-pid") ? $("#co-pid").value.trim().slice(0,24) : null, file });
      closeDlg(); toast(t("sent")); S.view = "orders"; render(); window.scrollTo(0,0);
    }catch(ex){ err.textContent = (ex && ex.message) ? ex.message : t("auth_fail"); btn.disabled = false; btn.textContent = t("send"); }
  }
  else if(f.id === "newProd"){
    const name = $("#np-name").value.trim();
    const slug = name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || ("p-"+Date.now());
    try{
      await api.saveProduct({ slug, name, category:$("#np-cat").value, price:Number($("#np-price").value), needs_player_id:$("#np-pid").checked, active:true, sort:200 });
      S.products = await api.products(); toast("Produto adicionado"); renderAdmin();
    }catch(ex){ toast("Erro: " + (ex.message || ex)); }
  }
});

async function afterLogin(res){
  if(!res) return;
  S.user = res.user; S.profile = res.profile;
  try{ S.products = await api.products(); }catch(_){}
  closeDlg(); renderNav();
  const pend = S.pending; S.pending = null;
  await render();
  if(pend){ const p = S.products.find(x => String(x.id) === String(pend)); if(p){ coState.method = "mpesa"; checkoutModal(p); } }
}

/* ---------- Arranque ---------- */
(async function boot(){
  const saved = store.get("lang", null);
  const nav = (navigator.language || "pt").slice(0,2);
  S.lang = LANGS[saved] ? saved : (LANGS[nav] ? nav : "pt");
  try{ S.products = await api.products(); }catch(e){ S.products = SEED; }
  try{
    const res = await api.init();
    if(res){ S.user = res.user; S.profile = res.profile; S.products = await api.products().catch(()=>S.products); }
    if(!DEMO) sb.auth.onAuthStateChange(async (ev) => { if(ev === "SIGNED_IN" && !S.user){ const r = await api.init(); if(r) await afterLogin(r); } });
  }catch(e){}
  render();
})();
</script>
